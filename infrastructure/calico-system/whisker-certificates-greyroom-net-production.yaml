---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: whisker-certificates-greyroom-net-production
  namespace: calico-system
spec:
  secretName: whisker-certificates-greyroom-net-production
  issuerRef:
    name: issuer-letsencrypt-production
    kind: ClusterIssuer
  commonName: "whisker.greyroom.net"
  dnsNames:
    - "whisker.greyroom.net"
