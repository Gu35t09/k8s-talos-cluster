apiVersion: v1
kind: Service
metadata:
  name: opnsense-node-exporter
  namespace: kube-prometheus-stack
  labels:
    app: opnsense-node-exporter
spec:
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: opnsense-node-exporter
  namespace: kube-prometheus-stack
subsets:
  - addresses:
      - ip: 192.168.100.2
    ports:
      - name: metrics
        port: 9100
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: opnsense-node-exporter-monitor
  namespace: kube-prometheus-stac
  labels:
    release: kube-prometheus-stack 
spec:
  selector:
    matchLabels:
      app: opnsense-node-exporter
  endpoints:
    - port: metrics
      interval: 15s
      scrapeTimeout: 10s
      path: /metrics