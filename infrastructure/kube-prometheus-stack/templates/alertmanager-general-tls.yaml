---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: alertmanager-general-tls
  namespace: kube-prometheus-stack
spec:
  secretName: alertmanager-general-tls
  issuerRef:
    name: issuer-letsencrypt-production
    kind: ClusterIssuer
  commonName: "alertmanager.greyroom.net"
  dnsNames:
    - "alertmanager.greyroom.net"
