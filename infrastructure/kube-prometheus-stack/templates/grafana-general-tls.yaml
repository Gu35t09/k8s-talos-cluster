---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-general-tls
  namespace: kube-prometheus-stack
spec:
  secretName: grafana-general-tls
  issuerRef:
    name: issuer-letsencrypt-production
    kind: ClusterIssuer
  commonName: "grafana.greyroom.net"
  dnsNames:
    - "grafana.greyroom.net"
