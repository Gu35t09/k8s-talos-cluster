# etcd-monitoring-service.yaml
apiVersion: v1
kind: Service
metadata:
  name: custom-etcd-metrics
  namespace: kube-system
  labels:
    app.kubernetes.io/name: custom-etcd-metrics
spec:
  type: ClusterIP
  externalIPs:
    - 192.168.100.21
    - 192.168.100.22
    - 192.168.100.23
  ports:
    - name: metrics
      port: 2381
      targetPort: 2381
      protocol: TCP