vikunja:
  image:
    repository: vikunja/vikunja

  env:
    VIKUNJA_SERVICE_PUBLICURL: "https://vikunja2.greyroom.net/"
    VIKUNJA_DATABASE_TYPE: "postgres"
    VIKUNJA_DATABASE_HOST: "pg-cluster-vikunja-rw"
    VIKUNJA_DATABASE_PORT: "5432"
    VIKUNJA_LOG_LEVEL: "DEBUG

    VIKUNJA_DATABASE_USER:
      valueFrom:
        secretKeyRef:
          name: pg-cluster-vikunja-app
          key: username

    VIKUNJA_DATABASE_PASSWORD:
      valueFrom:
        secretKeyRef:
          name: pg-cluster-vikunja-app
          key: password

    VIKUNJA_DATABASE_DATABASE:
      valueFrom:
        secretKeyRef:
          name: pg-cluster-vikunja-app
          key: dbname

  service:
    main:
      ports:
        http:
          port: 3456

  persistence:
    config:
      enabled: true
      type: pvc
      size: 1Gi

    data:
      enabled: true
      size: 2Gi
      mountPath: /app/vikunja/files
