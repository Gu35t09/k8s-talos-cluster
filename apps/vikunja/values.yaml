vikunja:
  image:
    repository: vikunja/vikunja

  env:
    VIKUNJA_SERVICE_PUBLICURL: "https://vikunja2.greyroom.net/"
    VIKUNJA_DB_TYPE: "postgres"
    VIKUNJA_DB_HOST: "pg-cluster-vikunja-rw"
    VIKUNJA_DB_PORT: "5432"
    VIKUNJA_LOG_LEVEL: "DEBUG"

  # Use envValueFrom for secret key references
  envValueFrom:
    VIKUNJA_DB_USER:
      secretKeyRef:
        name: pg-cluster-vikunja-app
        key: username
    VIKUNJA_DB_PASSWORD:
      secretKeyRef:
        name: pg-cluster-vikunja-app
        key: password
    VIKUNJA_DB_DATABASE:
      secretKeyRef:
        name: pg-cluster-vikunja-app
        key: dbname

  service:
    main:
      ports:
        http:
          port: 3456

  persistence:
    config:
      enabled: true
      type: pvc
      size: 1Gi

    data:
      enabled: true
      size: 2Gi
      mountPath: /app/vikunja/files