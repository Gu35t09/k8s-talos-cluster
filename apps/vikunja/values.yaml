app-template:
  controllers:
    vikunja:
      containers:
        main:
          image: 
            repository: vikunja/vikunja

  service:
    vikunja:
      controller: main
      ports:
        http:
          port: 3456

  ingress:
    main:
      hosts:
        - host: vikunja2.greyroom.net
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: vikunja
                port: http