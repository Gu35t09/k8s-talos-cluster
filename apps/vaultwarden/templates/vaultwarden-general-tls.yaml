---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vaultwarden-general-tls
  namespace: vaultwarden
spec:
  secretName: vaultwarden-general-tls
  issuerRef:
    name: issuer-letsencrypt-production
    kind: ClusterIssuer
  commonName: "vaultwarden.greyroom.net"
  dnsNames:
    - "vaultwarden.greyroom.net"
